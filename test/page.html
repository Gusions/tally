<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* minimal stand-in for Obsidian's CSS variables */
body{margin:0;font-family:-apple-system,Segoe UI,sans-serif}
body.theme-light{--background-primary:#fff;--background-secondary:#f5f6f8;--background-modifier-border:#dcdfe4;--background-modifier-hover:#e9ecf1;--text-normal:#222;--text-muted:#5c5f66;--text-faint:#8a8d93;--interactive-accent:#7b6cd9;--text-on-accent:#fff;--color-green:#2e9e48;--color-red:#d03b3b;--font-interface:system-ui;--font-monospace:ui-monospace,Menlo,monospace;--shadow-s:0 2px 8px rgba(0,0,0,.2);--font-ui-small:13px;--font-ui-smaller:12px;--font-ui-medium:15px}
body.theme-dark{--background-primary:#1e1e1e;--background-secondary:#262626;--background-modifier-border:#3a3a3a;--background-modifier-hover:#2f3238;--text-normal:#dadada;--text-muted:#a3a3a3;--text-faint:#767676;--interactive-accent:#7b6cd9;--text-on-accent:#fff;--color-green:#46c25b;--color-red:#f07373;--font-interface:system-ui;--font-monospace:ui-monospace,Menlo,monospace;--shadow-s:0 2px 8px rgba(0,0,0,.6);--font-ui-small:13px;--font-ui-smaller:12px;--font-ui-medium:15px}
body{background:var(--background-primary)}
.view-content.tally-view{padding:0 16px 32px;height:100vh;overflow:auto}
</style>
<link rel="stylesheet" href="../styles.css"></head>
<body class="theme-light"><div class="view-content tally-view"><div id="host"></div></div>
<script src="entry.js"></script></body></html>
